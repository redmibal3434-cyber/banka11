<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a}.top{background:#fff;border-bottom:1px solid #e4e7ec;padding:18px 28px}.head{max-width:1500px;margin:auto;display:flex;align-items:center;gap:22px;flex-wrap:wrap}.title{font-weight:800;font-size:25px;white-space:nowrap}.logos{display:grid;grid-template-columns:repeat(6,minmax(82px,1fr));gap:8px;flex:1}.logo{height:38px;border:1px solid #e4e7ec;border-radius:8px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-align:center;padding:4px}.wrap{max-width:1500px;margin:70px auto;padding:0 28px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:42px;box-shadow:0 8px 30px #1018280b}h1{font-size:46px;margin:0 0 20px}.muted{color:#667085;font-size:20px}.personal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;margin-top:36px}.field{margin:13px 0}label{display:block;font-size:16px;font-weight:700;margin-bottom:8px}input,select{width:100%;padding:15px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}.ref{background:#f9fafb;border:1px solid #e4e7ec;border-radius:13px;padding:15px;margin:10px 0}.refgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr .7fr 1fr;gap:10px;align-items:end}.btn{padding:12px 15px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:#175cd3;color:white}.secondary{background:#eef2f6}.danger{background:#fff;border:1px solid #e4e7ec}.summary,.notice{margin-top:14px;padding:14px;border:1px solid #e4e7ec;border-radius:11px;background:#f9fafb}.summary{display:flex;justify-content:space-between}.summary b{font-size:20px}.small{font-size:12px;color:#667085}.complete{width:100%;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e4e7ec;text-align:left;vertical-align:top}th{background:#f9fafb}@media(max-width:1050px){.logos{grid-template-columns:repeat(3,1fr)}.personal,.refgrid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.logos{grid-template-columns:repeat(2,1fr)}.personal,.refgrid{grid-template-columns:1fr}.card{padding:22px}h1{font-size:34px}.wrap{margin-top:30px}}</style></head><body><div class="top"><div class="title">Müşteri Hizmetleri / Admin</div></div><main class="wrap"><div class="card"><h1>Başvurular</h1><div style="overflow:auto"><table><thead><tr><th>Başvuru</th><th>Müşteri</th><th>Referans Bankalar</th><th>Talep Tutarı</th><th>Durum</th></tr></thead><tbody id="body"></tbody></table></div></div></main><script>
const money=n=>new Intl.NumberFormat('tr-TR').format(+n||0)+' TL';let apps=JSON.parse(localStorage.getItem('creditSupportApplicationsV5')||'[]'),b=document.getElementById('body');b.innerHTML=apps.length?'':'<tr><td colspan="5">Henüz başvuru yok.</td></tr>';apps.forEach(a=>{let refs=a.references.map(r=>`<div style="padding:8px 0;border-bottom:1px dashed #ddd"><b>${r.bank}</b><br>Talep No: ${r.requestNo||'-'} · Tarih: ${r.requestDate||'-'} · Kod: ${r.requestCode||'-'}<br>Kullanılabilir Limit: ${money(r.limit)} <span class="small">(müşteri beyanı)</span></div>`).join('');b.innerHTML+=`<tr><td>${a.id}<br><span class="small">${a.createdAt}</span></td><td>${a.firstName} ${a.lastName}<br>${a.phone}</td><td>${refs}</td><td>${money(a.requestedAmount)}</td><td>${a.status}</td></tr>`});</script></body></html>
