<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Faizsiz Destek Kredisi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#14233c}
.top{background:#10284d;color:#fff;padding:18px 26px;font-weight:800}.wrap{max-width:1450px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e1e8f1;border-radius:16px;padding:24px;box-shadow:0 8px 26px rgba(20,35,60,.07)}
.login{max-width:420px;margin:80px auto}.field{margin:15px 0}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #ccd7e5;border-radius:9px}
button{border:0;border-radius:9px;background:#286eea;color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}.muted{color:#68758a}.error{color:#b42318;margin-top:12px}
table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e4eaf2;text-align:left;vertical-align:top;font-size:13px}th{background:#f8faff;color:#10284d}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf4ff;color:#245fae;font-weight:700}.small{font-size:11px;color:#68758a}
@media(max-width:800px){.tablewrap{overflow:auto}table{min-width:950px}}
</style></head><body>
<div class="top">Faizsiz Destek Kredisi — Yönetim Paneli</div>
<main class="wrap">
<section class="card login" id="login"><h2>Yetkili Girişi</h2><p class="muted">Başvuruları görüntülemek için admin şifrenizi girin.</p>
<div class="field"><label>Admin Şifresi</label><input id="password" type="password" autocomplete="current-password"></div>
<button id="loginBtn">Giriş Yap</button><div class="error" id="loginError"></div></section>
<section class="card" id="panel" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><div><h2>Başvurular</h2><p class="muted">Tüm cihazlardan gönderilen merkezi başvuru kayıtları.</p></div><button id="refresh">Yenile</button></div>
<div class="tablewrap"><table><thead><tr><th>Başvuru</th><th>Müşteri</th><th>Referans Bankalar</th><th>Talep Tutarı</th><th>Durum</th></tr></thead><tbody id="body"></tbody></table></div></section>
</main>
<script>
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(n)||0);
let adminPassword='';
async function load(){
 const body=document.getElementById('body'); body.innerHTML='<tr><td colspan="5">Yükleniyor…</td></tr>';
 const r=await fetch('/api/admin-applications',{headers:{'x-admin-password':adminPassword}});
 const data=await r.json();
 if(!r.ok) throw new Error(data.error||'Giriş başarısız.');
 document.getElementById('login').style.display='none'; document.getElementById('panel').style.display='block';
 body.innerHTML=data.length?'':'<tr><td colspan="5">Henüz başvuru yok.</td></tr>';
 data.forEach(a=>{
   const refs=(a.references||[]).map(x=>`<div style="padding:6px 0;border-bottom:1px dashed #dce4ef"><b>${esc(x.bank_name)}</b><br>Talep No: ${esc(x.request_no||'-')} · Tarih: ${esc(x.request_date||'-')} · Kod: ${esc(x.request_code||'-')}<br>Kullanılabilir Limit: ${money(x.available_limit)}</div>`).join('');
   body.insertAdjacentHTML('beforeend',`<tr><td><b>${esc(a.application_no)}</b><br><span class="small">${new Date(a.created_at).toLocaleString('tr-TR')}</span></td><td>${esc(a.first_name)} ${esc(a.last_name)}<br>${esc(a.phone)}<br><span class="small">T.C.: ${esc(a.tc_no)}</span></td><td>${refs}</td><td>${money(a.requested_amount)}</td><td><span class="badge">${esc(a.status)}</span></td></tr>`);
 });
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('loginBtn').onclick=async()=>{adminPassword=document.getElementById('password').value;document.getElementById('loginError').textContent='';try{await load()}catch(e){document.getElementById('loginError').textContent=e.message}};
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()});
document.getElementById('refresh').onclick=()=>load().catch(e=>alert(e.message));
</script></body></html>
